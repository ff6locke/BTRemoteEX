name: Android APK
on: [push, workflow_dispatch]
permissions: { contents: read }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.10.2'
   - name: Reuse debug signing key for installable updates
     uses: actions/cache@v4
     with:
      path: ~/.android/debug.keystore
      key: btrremoteex-debug-signing-key-v2
   - name: Create stable debug signing key when absent
     run: |
      mkdir -p ~/.android
      if [ ! -f ~/.android/debug.keystore ]; then
       keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      fi
   - name: Verify persistent signing key fingerprint
     run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:"
   - run: gradle assembleDebug
   - name: Verify APK signing certificate
     run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
   - name: Add GitHub build number to APK filename
     run: cp app/build/outputs/apk/debug/app-debug.apk "BTRemoteEX-build-${GITHUB_RUN_NUMBER}.apk"
   - uses: actions/upload-artifact@v4
     with:
      name: BTRemoteEX-build-${{ github.run_number }}
      path: BTRemoteEX-build-${{ github.run_number }}.apk
      retention-days: 14
# Build D-pad navigation fixes on branch updates.
